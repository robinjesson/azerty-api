name: Cleanup GHCR Package Versions

on:
  workflow_dispatch: # Permet de déclencher manuellement le workflow depuis l'interface GitHub
  schedule:
    # Ce workflow s'exécutera tous les dimanches à minuit UTC.
    # Vous pouvez ajuster cette fréquence selon vos besoins.
    - cron: '0 0 * * 0'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Nécessaire pour supprimer des versions de packages

    steps:
      - name: Delete old untagged versions
        uses: actions/delete-package-versions@v5 # Utilise la version 5 de l'action
        with:
          package-name: 'my-budget-api' # Remplacez par le nom exact de votre package si différent
          # Conserve au moins les 5 versions les plus récentes du package, même si elles sont non taguées et vieilles.
          min-versions-to-keep: 5
          # Supprime les versions non taguées qui ont plus de 7 jours.
          min-age-to-delete-days: 7
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old snapshot versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'my-budget-api' # Remplacez par le nom exact de votre package si différent
          # Conserve au moins les 2 versions de snapshot les plus récentes.
          min-versions-to-keep: 2
          # Supprime les versions de snapshot (contenant "-SNAPSHOT") qui ont plus de 14 jours.
          min-age-to-delete-days: 14
          # Seules les versions dont le nom correspond à ce motif seront considérées pour la suppression ici.
          version-pattern: '.*-SNAPSHOT$'
          token: ${{ secrets.GITHUB_TOKEN }}